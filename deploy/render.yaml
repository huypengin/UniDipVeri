# ==============================================================================
# Render Blueprint Specification for UniDipVeri Public Showcase
# Deploys a unified container (Issuer + Verifier + Walt.id + Caddy Gateway)
# ==============================================================================

services:
  - type: web
    name: unidipveri-demo
    runtime: docker
    plan: free
    autoDeployTrigger: 'off'
    dockerContext: .
    dockerfilePath: deploy/Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: ISSUER_PRIVATE_KEY_JWK
        sync: false
      - key: STATUS_LIST_PATH
        value: /tmp/status-list.json
