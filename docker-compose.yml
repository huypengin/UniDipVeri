services:
  waltid-verifier:
    image: docker.io/waltid/verifier-api2:1.2.0@sha256:2e8581019531c2efa17a2c086b9c76ee7fee4bb5ee68369e2ea1864733039e9a
    ports:
      - "7004:7004"
    profiles: ["verifier"]

  caddy:
    image: docker.io/caddy:2.8-alpine
    ports:
      - "8080:8080"
    environment:
      - PLAYGROUND_UPSTREAM=playground:3001
      - ISSUER_UPSTREAM=issuer:3000
      - VERIFIER_UPSTREAM=waltid-verifier:7004
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - issuer
      - playground
      - waltid-verifier

  tunnel:
    build:
      context: .
      dockerfile: Dockerfile.tunnel
    volumes:
      - tunnel_data:/shared
    depends_on:
      - caddy
    restart: unless-stopped

  issuer:
    build:
      context: .
      dockerfile: Dockerfile.issuer
    ports:
      - "3000:3000"
    volumes:
      - tunnel_data:/shared
    depends_on:
      - waltid-verifier

  playground:
    build:
      context: .
      dockerfile: Dockerfile.playground
    ports:
      - "3001:3001"
    volumes:
      - tunnel_data:/shared
    depends_on:
      - issuer
      - waltid-verifier

volumes:
  tunnel_data:
